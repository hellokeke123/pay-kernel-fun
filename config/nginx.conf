# pay-kernel-fun 反向代理配置片段
#
# 只包含代理层，需要嵌入到实际的 server {} 块中使用（自行补充 listen/server_name 等配置）。
#
# 后端 pay-kernel-fun-launcher 的 server.servlet.context-path 固定为 /pay-api（见 application.yml），
# 前端 VUE_APP_BASE_API 也固定请求 /pay-api 前缀，且 vue.config.js 里没有做 pathRewrite 去掉这个前缀，
# 所以这里转发时同样不能 strip 前缀——proxy_pass 末尾不能带 /，否则 nginx 会把 /pay-api/ 从请求路径里去掉。

# 支付宝异步回调地址：POST /pay-api/trade/notify/{channel}，必须是表单类型的原始 body 透传，
# 且需要外网可达（支付宝服务器直接请求这里），单独摘出来是为了后续可以加更宽松的超时/更严格的来源限制。
location /pay-api/trade/notify/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 其余所有 /pay-api/* 请求（下单/查询/退款/关单/商品管理等），转发给 pay-kernel-fun-launcher
location /pay-api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 前端静态资源：pay-kernel-fun-ui 执行 `npm run build` 产出的 dist 目录，按需改成实际部署路径。
# 路由用的是 hash 模式（/#/goods 这种），刷新不会向服务端请求 /goods，理论上不需要 SPA 回退规则；
# 这里仍然用命名 location（@fallback）+ rewrite ... break 兜底，为以后路由模式改成 history 时预留。
# 不用 try_files $uri $uri/ /index.html 直接写字符串路径——那种写法的内部跳转会重新进入完整的
# location 匹配阶段，一旦环境里有其它规则把请求送回本层，就会形成 nginx 报的
# "rewrite or internal redirection cycle"；rewrite ... break 不会重新触发匹配，从根上避免这个坑。
location / {
    root /usr/share/nginx/html/pay-kernel-fun-ui;
    index index.html;
    try_files $uri $uri/ @fallback;
}

location @fallback {
    rewrite ^ /index.html break;
    root /usr/share/nginx/html/pay-kernel-fun-ui;
}
